<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if outcome %}{{ outcome.verdict }} · {% endif %}HookLine</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <main>
    <header class="masthead">
      <h1><a href="{{ url_for('index') }}">HookLine</a></h1>
      <p>Check a suspicious email before anyone clicks it.</p>
    </header>

    <form class="upload" action="{{ url_for('analyse') }}#result" method="post" enctype="multipart/form-data">
      <label class="field">
        <span>Email file (.eml)</span>
        <input type="file" name="email" accept=".eml,message/rfc822" required>
      </label>
      <label class="option">
        <input type="checkbox" name="virustotal" value="1" checked>
        Also check VirusTotal (can take up to 2 minutes)
      </label>
      <button type="submit">Analyse email</button>
    </form>

    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    {% block content %}{% endblock %}
  </main>
  <script>
    document.querySelector(".upload").addEventListener("submit", function (e) {
      var b = e.target.querySelector("button");
      b.disabled = true;
      b.textContent = e.target.virustotal.checked ? "Checking... (VirusTotal can take a minute or two)" : "Checking...";
    });
  </script>
</body>
</html>
